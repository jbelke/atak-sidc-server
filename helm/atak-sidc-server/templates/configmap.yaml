apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "atak-sidc-server.fullname" . }}
  labels:
    {{- include "atak-sidc-server.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Derived from .Values.containerPorts so the ports are declared once.
  PORT: {{ .Values.containerPorts.http | quote }}
  PM2_PORT: {{ .Values.containerPorts.pm2 | quote }}
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
